SKIN_NAME = Skyfield
SKIN_VERSION = 2.3.4

# The page's language: WeeWX merges lang/<lang>.conf over this skin.conf.
# Override per report in weewx.conf ([StdReport] [[SkyfieldReport]]).
lang = en

# The page's theme: dark (the night plate), light (the paper-atlas plate),
# or auto -- light while the sun is up at generation time, dark otherwise
# (the page regenerates each report cycle, so the flip lags sunrise/sunset
# by at most one archive interval; no JavaScript is involved).  Override
# per report in weewx.conf ([StdReport] [[SkyfieldReport]]).
theme = dark

# The dome's stars.  It plots every star of the bundled Hipparcos
# catalog at least star_mag_limit bright (magnitudes run backwards:
# 6.5 is the naked-eye limit, Sirius is -1.4) -- a true sky map -- and
# labels named stars at least star_label_mag bright.  The pre-2.0
# sparse chart is star_mag_limit = 2.6, star_label_mag = 1.1.
# Override per report in weewx.conf ([StdReport] [[SkyfieldReport]]).
star_mag_limit = 5.0
star_label_mag = 2.5

# The dome's constellation figures: the 88 constellations' stick figures
# (distilled from the Stellarium project's "modern" sky culture), each
# substantially-risen figure carrying the constellation's name -- which
# translates like everything else, through [Almanac] [[Constellations]].
# Set false for the plain dome.  Override per report in weewx.conf
# ([StdReport] [[SkyfieldReport]]).
constellation_lines = true

[CheetahGenerator]
    encoding = html_entities
    search_list_extensions = user.wxskyfield_sky.SkyfieldSky
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

[CopyGenerator]
    # The stylesheet and the tap-tooltip script only need copying once.
    copy_once = sky.css, sky.js

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
