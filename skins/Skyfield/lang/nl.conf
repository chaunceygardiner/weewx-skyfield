# skins/Skyfield/lang/nl.conf
#
# Dutch -- Nederlands.  Complete; Beta pending native-speaker review.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-skyfield/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Afkortingen van de windstreken voor de breedte/lengte in de koptekst
    hemispheres = N, Z, O, W

[Units]

    [[Ordinates]]

        # Windstreken; de panelen gebruiken N, O, Z en W.
        # Zoals in het nl.conf-bestand van WeeWX zelf.
        directions = N, NNO, NO, ONO, O, OZO, ZO, ZZO, Z, ZZW, ZW, WZW, W, WNW, NW, NNW, N/A

[Almanac]

    # Fasen van de maan, voor $almanac.moon_phase in de koptekst.
    # Zoals in het nl.conf-bestand van WeeWX zelf.
    moon_phases = Nieuw, Jonge Maansikkel, Eerste Kwartier, Wassende Maan, Vol, Afnemende Maan, Laatste Kwartier, Asgrauwe Maan

    # Weergavenamen van de hemellichamen, sleutel = tagnaam:
    # $almanac.<body>.label en elk bijschrift, elke kaart, elke tabelregel,
    # elke tooltip.  Sterren met een naam gaan op dezelfde manier
    # (bijv. polaris = Poolster).
    sun = Zon
    moon = Maan
    mercury = Mercurius
    venus = Venus
    earth = Aarde
    mars = Mars
    jupiter = Jupiter
    saturn = Saturnus
    uranus = Uranus
    neptune = Neptunus

    # Weergavenamen van satellieten, sleutel = tagnaam
    # ([Skyfield] [[Satellites]]).
    iss = ISS
    tiangong = Tiangong
    hst = HST

