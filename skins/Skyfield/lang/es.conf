[Texts]

    # ── prosa de la página (index.html.tmpl) ─────────────────────────────
    "The Sky over {location}" = "El cielo sobre {location}"
    'The Sky <span class="over">over</span> {location}' = 'El cielo <span class="over">sobre</span> {location}'
    "{pct}% illuminated" = "{pct} % iluminada"
    "moonset {time}" = "puesta de la Luna {time}"
    "The Sky Now · looking up" = "El cielo ahora · mirando hacia arriba"
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "El norte arriba, el este a la izquierda — la orientación de una carta celeste, como tumbado boca arriba mirando al cielo.  Círculos de altura a 30° y 60°; el borde es el horizonte."
    "The sun is up, so the plate shows the stars where they stand behind the daylight — Skyfield knows, even when you cannot see them." = "El Sol está sobre el horizonte, así que la lámina muestra las estrellas allí donde se encuentran tras la luz del día — Skyfield lo sabe, aunque no puedas verlas."
    "Dot size follows magnitude; the brighter the star, the larger the mark." = "El tamaño de los puntos sigue la magnitud: cuanto más brillante la estrella, mayor la marca."
    "Hover any mark for its coordinates." = "Pasa el cursor sobre una marca para ver sus coordenadas."
    "Rise & Set · today" = "Salidas & puestas · hoy"
    "Bars span each body's time above the horizon; the tick across each bar is the transit.  Background bands are tonight's darkness: civil, nautical and astronomical twilight — the USNO geometric definitions." = "Las barras abarcan el tiempo que cada astro pasa sobre el horizonte; la marca que cruza cada barra es el tránsito.  Las bandas del fondo son la oscuridad de esta noche: crepúsculos civil, náutico y astronómico — las definiciones geométricas del USNO."
    "The Solar Year · daylight week by week" = "El año solar · la luz del día semana a semana"
    "Sunrise, sunset and solar noon (dashed) for every week of the year, over the same twilight bands as the timeline above — in local clock time, so the daylight-saving steps in spring and fall are real.  The brass line is today." = "Salida y puesta del Sol y mediodía solar (a trazos) para cada semana del año, sobre las mismas bandas crepusculares que la línea de tiempo de arriba — en hora local del reloj, así que los saltos del horario de verano en primavera y otoño son reales.  La línea color latón es hoy."
    "The Lunar Month · this lunation" = "El mes lunar · esta lunación"
    "New moon to new moon in thirty steps, the principal phases dated; the brass ring is today.  Hover any disc for its date and illumination." = "De luna nueva a luna nueva en treinta pasos, con las fases principales fechadas; el anillo color latón es hoy.  Pasa el cursor sobre un disco para ver su fecha y su iluminación."
    "The Almanac Table" = "La tabla del almanaque"
    "Every value on this page is a WeeWX report tag served by weewx-skyfield — no PyEphem, no downloads at run time." = "Cada valor de esta página es un tag de informe de WeeWX servido por weewx-skyfield — sin PyEphem y sin descargas durante la ejecución."
    "Sun & Planets · today" = "Sol & planetas · hoy"
    "The Sun’s Path · today" = "La trayectoria del Sol · hoy"
    "Altitude against azimuth from midnight to midnight, a dot every hour.  The dashed curve is the moon’s path, its rise, set and highest point marked with times; the 00 and 24 dots are the moon’s positions at the day’s two midnights — the curve is open between them because a lunar day runs about 50 minutes longer than a calendar day, and near full moon that break sits right at the top of the arc.  The bands below the horizon line are civil, nautical and astronomical twilight depth." = "Altura frente a acimut de medianoche a medianoche, un punto cada hora.  La curva a trazos es la trayectoria de la Luna, con las horas de su salida, su puesta y su punto más alto; los puntos 00 y 24 son las posiciones de la Luna en las dos medianoches del día — la curva queda abierta entre ellos porque un día lunar dura unos 50 minutos más que un día del calendario, y cerca de la luna llena esa abertura cae justo en lo alto del arco.  Las bandas bajo la línea del horizonte son la profundidad de los crepúsculos civil, náutico y astronómico."
    "The Solar System · today's positions" = "El sistema solar · las posiciones de hoy"
    "Heliocentric longitudes, viewed from above the north ecliptic pole; orbit spacing is logarithmic.  The dashed ray marks 0° (the direction of the vernal equinox)." = "Longitudes heliocéntricas, vistas desde encima del polo norte de la eclíptica; la separación entre órbitas es logarítmica.  El rayo a trazos marca 0° (la dirección del punto vernal)."
    "Analemma · the sun at noon" = "Analema · el Sol al mediodía"
    "The sun's altitude and azimuth at local standard noon for every week of the year.  The figure-eight is the sum of Earth's tilt and its elliptical orbit; the brass point is this week." = "La altura y el acimut del Sol al mediodía de la hora estándar, para cada semana del año.  El ocho es la suma de la inclinación del eje de la Tierra y de su órbita elíptica; el punto color latón es esta semana."

