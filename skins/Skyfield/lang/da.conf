[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The Sky over {location}" = "Himlen over {location}"
    'The Sky <span class="over">over</span> {location}' = 'Himlen <span class="over">over</span> {location}'
    "{pct}% illuminated" = "{pct}% belyst"
    "moonset {time}" = "Månenedgang {time}"
    "The Sky Now · looking up" = "Himlen nu · kiggende op"
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Nord øverst, øst til venstre — stjernekortets orientering, som hvis du ligger på ryggen og kigger op mod himlen. Højderinge ved 30° og 60°; kanten markerer horisonten."
    "The sun is up, so the plate shows the stars where they stand behind the daylight — Skyfield knows, even when you cannot see them." = "Solen er over horisonten, så skiven viser stjernerne dér, hvor de befinder sig bag dagslyset — Skyfield ved det, selv når du ikke kan se dem."
    "Dot size follows magnitude; the brighter the star, the larger the mark." = "Prikkernes størrelse følger stjernernes magnitude; jo klarere stjernen er, desto større er markeringen."
    "Hover any mark for its coordinates." = "Hold markøren over en markering for at se dens koordinater."
    "Rise & Set · today" = "Op- og nedgang · i dag"
    "Bars span each body's time above the horizon; the tick across each bar is the transit.  Background bands are tonight's darkness: civil, nautical and astronomical twilight — the USNO geometric definitions." = "Søjlerne viser den tid, hvert himmellegeme befinder sig over horisonten; den lyse markering angiver kulminationen. Baggrundsbåndene viser nattens mørkeperioder: borgerlig, nautisk og astronomisk tusmørke — efter USNO’s geometriske definitioner."
    "The Solar Year · daylight week by week" = "Solåret · dagslys uge for uge"
    "Sunrise, sunset and solar noon (dashed) for every week of the year, over the same twilight bands as the timeline above — in local clock time, so the daylight-saving steps in spring and fall are real.  The brass line is today." = "Solopgang, solnedgang og sand middag (stiplet linje) for hver uge af året, vist over de samme tusmørkebånd som tidslinjen ovenfor — i lokal klokketid, så overgangen til og fra sommertid i foråret og efteråret fremgår korrekt. Den messingfarvede linje markerer i dag."
    "The Lunar Month · this lunation" = "Månemåneden · denne månecyklus"
    "New moon to new moon in thirty steps, the principal phases dated; the brass ring is today.  Hover any disc for its date and illumination." = "Fra nymåne til nymåne i tredive trin, med de vigtigste månefaser angivet med dato. Den messingfarvede ring markerer i dag. Hold markøren over en måneskive for at se dens dato og belysningsgrad."
    "The Almanac Table" = "Almanaktabellen"
    "Every value on this page is a WeeWX report tag served by weewx-skyfield — no PyEphem, no downloads at run time." = "Alle værdier på denne side er WeeWX-rapporttags leveret af weewx-skyfield — ingen PyEphem og ingen downloads under kørsel."
    "Sun & Planets · today" = "Solen og planeterne · i dag"
    "The Sun’s Path · today" = "Solens bane · i dag"
    "Altitude against azimuth from midnight to midnight, a dot every hour.  The dashed curve is the moon’s path, its rise, set and highest point marked with times; the 00 and 24 dots are the moon’s positions at the day’s two midnights — the curve is open between them because a lunar day runs about 50 minutes longer than a calendar day, and near full moon that break sits right at the top of the arc.  The bands below the horizon line are civil, nautical and astronomical twilight depth." = "Højde over horisonten i forhold til azimut fra midnat til midnat, med en markering for hver time. Den stiplede kurve viser Månens bane, hvor opgang, nedgang og højeste punkt er markeret med tidspunkter. Markeringerne 00 og 24 viser Månens position ved døgnets to midnætter — kurven er åben mellem dem, fordi et månedøgn varer cirka 50 minutter længere end et kalenderdøgn, og nær fuldmåne ligger dette brud lige ved banens højeste punkt. Båndene under horisontlinjen viser dybden af det borgerlige, nautiske og astronomiske tusmørke."
    "The Solar System · today's positions" = "Solsystemet · dagens positioner"
    "Heliocentric longitudes, viewed from above the north ecliptic pole; orbit spacing is logarithmic.  The dashed ray marks 0° (the direction of the vernal equinox)." = "Heliocentriske længdegrader, set ovenfra den nordlige ekliptiske pol; afstandene mellem banerne er vist med logaritmisk skala. Den stiplede stråle markerer 0° (retningen mod forårspunktet)."
    "Analemma · the sun at noon" = "Analemma · Solen ved middagstid"
    "The sun's altitude and azimuth at local standard noon for every week of the year.  The figure-eight is the sum of Earth's tilt and its elliptical orbit; the brass point is this week." = "Solens højde og azimut ved lokal standardmiddag for hver uge af året. Den ottetalsformede figur er resultatet af Jordens hældning og dens elliptiske bane om Solen; det messingfarvede punkt markerer denne uge."

