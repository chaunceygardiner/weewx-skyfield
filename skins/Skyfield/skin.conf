SKIN_NAME = Skyfield
SKIN_VERSION = 1.16

# The page's language: WeeWX merges lang/<lang>.conf over this skin.conf.
# Override per report in weewx.conf ([StdReport] [[SkyfieldReport]]).
lang = en

# The page's theme: dark (the night plate), light (the paper-atlas plate),
# or auto -- light while the sun is up at generation time, dark otherwise
# (the page regenerates each report cycle, so the flip lags sunrise/sunset
# by at most one archive interval; no JavaScript is involved).  Override
# per report in weewx.conf ([StdReport] [[SkyfieldReport]]).
theme = dark

[CheetahGenerator]
    encoding = html_entities
    search_list_extensions = user.wxskyfield_sky.SkyfieldSky
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

[CopyGenerator]
    # The stylesheet only needs to be copied once.
    copy_once = sky.css

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
