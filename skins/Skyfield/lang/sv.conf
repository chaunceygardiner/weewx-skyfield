# skins/Skyfield/lang/sv.conf
#
# Swedish -- Svenska.  Complete; Beta pending native-speaker review.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-skyfield/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Hemisphere abbreviations, for the latitude/longitude in the header.
    # Swedish coordinates abbreviate east as Ö (östlig längd) …
    hemispheres = N, S, Ö, V

[Units]

    [[Ordinates]]

        # … while the compass winds use O (ost): nordost NO, sydost SO.
        # The panels use N, O, S and V.
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSV, SV, VSV, V, VNV, NV, NNV, N/A

[Almanac]

    # Moon phase names, for $almanac.moon_phase in the header
    moon_phases = Nymåne, Tilltagande skära, Första kvarteret, Tilltagande måne, Fullmåne, Avtagande måne, Sista kvarteret, Avtagande skära

    # Body display names, keyed by tag name: $almanac.<body>.label and
    # every panel label, chip, table row and tooltip.  Named stars may be
    # added the same way (e.g. polaris = Polstjärnan).
    sun = Solen
    moon = Månen
    mercury = Merkurius
    venus = Venus
    earth = Jorden
    mars = Mars
    jupiter = Jupiter
    saturn = Saturnus
    uranus = Uranus
    neptune = Neptunus

    # Satellite display names, keyed by tag name -- the [Skyfield]
    # [[Satellites]] entries.
    iss = ISS
    tiangong = Tiangong
    hst = HST

    # Comet display names, keyed by tag name -- the [Skyfield]
    # [[Comets]] entries.  A comet without one shows its tag name
    # title-cased.
    halley = Halley
    hale_bopp = Hale-Bopp

    # Meteor shower display names, keyed by the shower key --
