[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The Sky over {location}" = "Himmelen over {location}"
    'The Sky <span class="over">over</span> {location}' = 'Himmelen <span class="over">over</span> {location}'
    "{pct}% illuminated" = "{pct}% belyst"
    "moonset {time}" = "månenedgang {time}"
    "The Sky Now · looking up" = "Himmelen nå · sett rett opp"
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Nord øverst, øst til venstre — stjernekartets orientering, som om du ligger på ryggen og ser opp.  Høyderinger ved 30° og 60°; kanten er horisonten."
    "The sun is up, so the plate shows the stars where they stand behind the daylight — Skyfield knows, even when you cannot see them." = "Solen er over horisonten, så platen viser stjernene der de står bak dagslyset — Skyfield vet det, selv når du ikke kan se dem."
    "Dot size follows magnitude; the brighter the star, the larger the mark." = "Prikkenes størrelse følger magnituden; jo klarere stjernen er, desto større er merket."
    "Hover or tap any mark for its coordinates." = "Hold pekeren over eller trykk på et merke for å se koordinatene."
    "Rise & Set · today" = "Opp- og nedgang · i dag"
    "Bars span each body's time above the horizon; the tick across each bar is the transit.  Background bands are tonight's darkness: civil, nautical and astronomical twilight — the USNO geometric definitions." = "Søylene spenner over tiden hvert himmellegeme står over horisonten; streken tvers over hver søyle er kulminasjonen.  Båndene i bakgrunnen er nattens mørke: borgerlig, nautisk og astronomisk tussmørke — USNOs geometriske definisjoner."
    "The Solar Year · daylight week by week" = "Solåret · dagslys uke for uke"
    "Sunrise, sunset and solar noon (dashed) for every week of the year, over the same twilight bands as the timeline above — in local clock time, so the daylight-saving steps in spring and fall are real.  The brass line is today." = "Soloppgang, solnedgang og sann middag (stiplet) for hver uke i året, over de samme tussmørkebåndene som tidslinjen ovenfor — i lokal klokketid, så sommertidsskiftene vår og høst er reelle.  Den messingfargede linjen er i dag."
    "The Lunar Month · this lunation" = "Månemåneden · denne lunasjonen"
    "New moon to new moon in thirty steps, the principal phases dated; the brass ring is today.  Hover or tap any disc for its date and illumination." = "Fra nymåne til nymåne i tretti trinn, med de viktigste fasene datert; den messingfargede ringen er i dag.  Hold pekeren over eller trykk på en skive for å se dato og belysningsgrad."
    "The Almanac Table" = "Almanakktabellen"
    "Every value on this page is a WeeWX report tag served by weewx-skyfield — no PyEphem, and the page itself fetches nothing." = "Hver verdi på denne siden er en WeeWX-rapporttag levert av weewx-skyfield — ingen PyEphem, og siden selv henter ingenting."
    "Sun & Planets · today" = "Solen og planetene · i dag"
    "Satellites · the next visible pass" = "Satellitter · neste synlige passasje"
    "Each row is the satellite's next visible pass — visible means the satellite is sunlit while your sky is dark, peaking at least 10° up.  The soonest of these passes gets its own chart below.  Orbital elements refresh from CelesTrak every few hours." = "Hver rad er satellittens neste synlige passasje — synlig betyr at satellitten er solbelyst mens himmelen din er mørk, og når minst 10° opp.  Den nærmeste av disse passasjene får sitt eget kart nedenfor.  Baneelementene oppdateres fra CelesTrak med noen timers mellomrom."
    "The Next Visible Pass · the sky at its peak" = "Neste synlige passasje · himmelen på det høyeste punktet"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Hele himmelen slik den vil stå ved passasjens høyeste punkt, på datoen ovenfor — den stiplede buen er satellittens bane, med tidspunktene for når den kommer til syne og forsvinner i endene.  Bare stjerner som er klare nok for en tussmørkehimmel tegnes: en synlig passasje skjer mens himmelen er halvmørk."
    "The Sun’s Path · today" = "Solens bane · i dag"
    "Altitude against azimuth from midnight to midnight, a dot every hour.  The dashed curve is the moon’s path, its rise, set and highest point marked with times; the 00 and 24 dots are the moon’s positions at the day’s two midnights — the curve is open between them because a lunar day runs about 50 minutes longer than a calendar day, and near full moon that break sits right at the top of the arc.  The bands below the horizon line are civil, nautical and astronomical twilight depth." = "Høyde mot asimut fra midnatt til midnatt, en prikk hver time.  Den stiplede kurven er Månens bane, med tidspunkter for oppgang, nedgang og høyeste punkt; prikkene 00 og 24 er Månens posisjoner ved døgnets to midnatter — kurven er åpen mellom dem fordi et månedøgn varer omtrent 50 minutter lenger enn et kalenderdøgn, og nær fullmåne ligger bruddet helt øverst på buen.  Båndene under horisontlinjen er dybden av borgerlig, nautisk og astronomisk tussmørke."
    "The Solar System · today's positions" = "Solsystemet · dagens posisjoner"
    "Heliocentric longitudes, viewed from above the north ecliptic pole; orbit spacing is logarithmic.  The dashed ray marks 0° (the direction of the vernal equinox)." = "Heliosentriske lengdegrader, sett ovenfra den nordlige ekliptikkpolen; avstanden mellom banene er logaritmisk.  Den stiplede strålen markerer 0° (retningen mot vårjevndøgnspunktet)."
    "Analemma · the sun at noon" = "Analemma · Solen ved middag"
    "The sun's altitude and azimuth at local standard noon for every week of the year.  The figure-eight is the sum of Earth's tilt and its elliptical orbit; the brass point is today." = "Solens høyde og asimut ved lokal normaltids middag for hver uke i året.  Åttetallet er summen av Jordens aksehelning og dens elliptiske bane; det messingfargede punktet er i dag."

