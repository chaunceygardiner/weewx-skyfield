    # ── date formats (strftime) ──────────────────────────────────────────
    # A translation reorders day and month and adjusts punctuation; the
    # month and weekday NAMES (%b, %B, %A) come from strftime, i.e. the
    # weewxd process locale.
    "%b %-d" = "%-d. %b"
    "%b %-d %Y" = "%-d. %b %Y"
    "%A, %B %-d %Y, %-H:%M %Z" = "%A den %-d. %B %Y, %-H:%M %Z"
