# skins/Skyfield/lang/it.conf
#
# Italian -- Italiano.  Complete; Beta pending native-speaker review.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-skyfield/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Hemisphere abbreviations, for the latitude/longitude in the header
    hemispheres = N, S, E, O

[Units]

    [[Ordinates]]

        # Compass ordinal directions; the panels use N, E, S and O.
        # As in WeeWX's own it.conf.
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N.D.

[Almanac]

    # Moon phase names, for $almanac.moon_phase in the header.
    # As in WeeWX's own it.conf.
    moon_phases = Nuova, Crescente, Primo quarto, Gibbosa crescente, Piena, Gibbosa calante, Ultimo quarto, Calante

    # Body display names, keyed by tag name: $almanac.<body>.label and
    # every panel label, chip, table row and tooltip.  Named stars may be
    # added the same way (e.g. polaris = Stella Polare).
    sun = Sole
    moon = Luna
    mercury = Mercurio
    venus = Venere
    earth = Terra
    mars = Marte
    jupiter = Giove
    saturn = Saturno
    uranus = Urano
    neptune = Nettuno

    # Satellite display names, keyed by tag name -- the [Skyfield]
    # [[Satellites]] entries.
    iss = ISS
    tiangong = Tiangong
    hst = HST

    # Comet display names, keyed by tag name -- the [Skyfield]
    # [[Comets]] entries.  A comet without one shows its tag name
    # title-cased.
    halley = Halley
    hale_bopp = Hale-Bopp

    # Meteor shower display names, keyed by the shower key --
    # $almanac.next_meteor_shower.label and the countdown chip.
    [[MeteorShowers]]
        quadrantids = Quadrantidi
        lyrids = Liridi
        eta_aquariids = Eta Aquaridi
        delta_aquariids = Delta Aquaridi meridionali
        perseids = Perseidi
        draconids = Draconidi
        orionids = Orionidi
        southern_taurids = Tauridi meridionali
        northern_taurids = Tauridi settentrionali
        leonids = Leonidi
        geminids = Geminidi
        ursids = Ursidi

    # Constellation display names, keyed by IAU abbreviation:
