[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The Sky over {location}" = "Der Himmel über {location}"
    'The Sky <span class="over">over</span> {location}' = 'Der Himmel <span class="over">über</span> {location}'
    "{pct}% illuminated" = "{pct} % beleuchtet"
    "moonset {time}" = "Monduntergang {time}"
    "The Sky Now · looking up" = "Der Himmel jetzt · Blick nach oben"
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Norden oben, Osten links — die Orientierung einer Himmelskarte, wie auf dem Rücken liegend nach oben geschaut.  Höhenringe bei 30° und 60°; der Rand ist der Horizont."
    "The sun is up, so the plate shows the stars where they stand behind the daylight — Skyfield knows, even when you cannot see them." = "Die Sonne ist aufgegangen; die Karte zeigt die Sterne dort, wo sie hinter dem Tageslicht stehen — Skyfield weiß es, auch wenn man sie nicht sehen kann."
    "Dot size follows magnitude; the brighter the star, the larger the mark." = "Die Punktgröße folgt der Helligkeit: je heller der Stern, desto größer die Marke."
    "Hover any mark for its coordinates." = "Für die Koordinaten mit der Maus auf eine Marke zeigen."
    "Rise & Set · today" = "Auf- & Untergang · heute"
    "Bars span each body's time above the horizon; the ivory tick is the transit.  Background bands are tonight's darkness: civil, nautical and astronomical twilight — the USNO geometric definitions." = "Die Balken umspannen die Zeit jedes Körpers über dem Horizont; der elfenbeinfarbene Strich ist der Transit.  Die Bänder im Hintergrund sind die Dunkelheit dieser Nacht: bürgerliche, nautische und astronomische Dämmerung — nach den geometrischen Definitionen des USNO."
    "The Solar Year · daylight week by week" = "Das Sonnenjahr · Tageslicht Woche für Woche"
    "Sunrise, sunset and solar noon (dashed) for every week of the year, over the same twilight bands as the timeline above — in local clock time, so the daylight-saving steps in spring and fall are real.  The brass line is today." = "Sonnenaufgang, Sonnenuntergang und wahrer Mittag (gestrichelt) für jede Woche des Jahres, über denselben Dämmerungsbändern wie in der Zeitleiste oben — in lokaler Uhrzeit, die Sommerzeitsprünge im Frühjahr und Herbst sind also echt.  Die messingfarbene Linie ist heute."
    "The Lunar Month · this lunation" = "Der Mondmonat · diese Lunation"
    "New moon to new moon in thirty steps, the principal phases dated; the brass ring is today.  Hover any disc for its date and illumination." = "Von Neumond zu Neumond in dreißig Schritten, die Hauptphasen mit Datum; der messingfarbene Ring ist heute.  Für Datum und Beleuchtung mit der Maus auf eine Scheibe zeigen."
    "The Almanac Table" = "Die Almanach-Tabelle"
    "Every value on this page is a WeeWX report tag served by weewx-skyfield — no PyEphem, no downloads at run time." = "Jeder Wert auf dieser Seite ist ein WeeWX-Report-Tag, geliefert von weewx-skyfield — kein PyEphem, keine Downloads zur Laufzeit."
    "Sun & Planets · today" = "Sonne & Planeten · heute"
    "The Sun’s Path · today" = "Die Sonnenbahn · heute"
    "Altitude against azimuth from midnight to midnight, a dot every hour.  The dashed curve is the moon’s path, its rise, set and highest point marked with times; the 00 and 24 dots are the moon’s positions at the day’s two midnights — the curve is open between them because a lunar day runs about 50 minutes longer than a calendar day, and near full moon that break sits right at the top of the arc.  The bands below the horizon line are civil, nautical and astronomical twilight depth." = "Höhe gegen Azimut von Mitternacht bis Mitternacht, ein Punkt pro Stunde.  Die gestrichelte Kurve ist die Mondbahn, mit Uhrzeiten an Aufgang, Untergang und Höchststand; die Punkte 00 und 24 sind die Mondpositionen an den beiden Mitternachten des Tages — dazwischen bleibt die Kurve offen, weil ein Mondtag rund 50 Minuten länger dauert als ein Kalendertag, und um Vollmond sitzt diese Lücke genau oben am Scheitel des Bogens.  Die Bänder unter der Horizontlinie sind die Tiefe der bürgerlichen, nautischen und astronomischen Dämmerung."
    "The Solar System · today's positions" = "Das Sonnensystem · die Positionen heute"
    "Heliocentric longitudes, viewed from above the north ecliptic pole; orbit spacing is logarithmic.  The dashed ray marks 0° (the direction of the vernal equinox)." = "Heliozentrische Längen, gesehen von oberhalb des nördlichen Ekliptikpols; die Bahnabstände sind logarithmisch.  Der gestrichelte Strahl markiert 0° (die Richtung des Frühlingspunkts)."
    "Analemma · the sun at noon" = "Analemma · die Sonne am Mittag"
    "The sun's altitude and azimuth at local standard noon for every week of the year.  The figure-eight is the sum of Earth's tilt and its elliptical orbit; the brass point is this week." = "Höhe und Azimut der Sonne am Mittag der Normalzeit, für jede Woche des Jahres.  Die Acht ist die Summe aus der Neigung der Erdachse und der elliptischen Erdbahn; der messingfarbene Punkt ist diese Woche."

