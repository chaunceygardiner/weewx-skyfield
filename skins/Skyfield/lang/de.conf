# skins/Skyfield/lang/de.conf
#
# German -- Deutsch.  Complete; native-speaker reviewed (2026-07-28).
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-skyfield/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Abkuerzungen der Himmelsrichtungen fuer Breite/Laenge in der Kopfzeile
    hemispheres = N, S, O, W

[Units]

    [[Ordinates]]

        # Himmelsrichtungen; die Panels verwenden N, O, S und W
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSW, SW, WSW, W, WNW, NW, NNW, N/A

[Almanac]

    # Mondphasen, fuer $almanac.moon_phase in der Kopfzeile
    moon_phases = Neumond, zunehmende Sichel, erstes Viertel, zunehmender Mond, Vollmond, abnehmender Mond, letztes Viertel, abnehmende Sichel

    # Anzeigenamen der Koerper, Schluessel = Tag-Name: $almanac.<body>.label
    # und jede Beschriftung, jeder Chip, jede Tabellenzeile, jeder Tooltip.
    # Benannte Sterne koennen genauso ergaenzt werden (z.B. polaris = Polarstern).
    # Sonne und Mond wie im Seasons-Skin von WeeWX; die Planetennamen nach der
    # Liste der Planeten des Sonnensystems der deutschsprachigen Wikipedia
    # (https://de.wikipedia.org/wiki/Liste_der_Planeten_des_Sonnensystems,
    # abgerufen 2026-07-28).
    sun = Sonne
    moon = Mond
    mercury = Merkur
    venus = Venus
    earth = Erde
    mars = Mars
    jupiter = Jupiter
    saturn = Saturn
    uranus = Uranus
    neptune = Neptun

    # Anzeigenamen der Satelliten, Schluessel = Tag-Name
    # ([Skyfield] [[Satellites]]).
    iss = ISS
    tiangong = Tiangong
    hst = HST

    # Comet display names, keyed by tag name -- the [Skyfield]
    # [[Comets]] entries.  A comet without one shows its tag name
    # title-cased.
    halley = Halley
    hale_bopp = Hale-Bopp

    # Meteor shower display names, keyed by the shower key --
    # $almanac.next_meteor_shower.label and the countdown chip.
