SKIN_NAME = Skyfield
SKIN_VERSION = 1.12

# The page's language: WeeWX merges lang/<lang>.conf over this skin.conf.
# Override per report in weewx.conf ([StdReport] [[SkyfieldReport]]).
lang = en

[CheetahGenerator]
    encoding = html_entities
    search_list_extensions = user.wxskyfield_sky.SkyfieldSky
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

[CopyGenerator]
    # The stylesheet only needs to be copied once.
    copy_once = sky.css

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
