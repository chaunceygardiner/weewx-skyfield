[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The Sky over {location}" = "Le ciel au-dessus de {location}"
    'The Sky <span class="over">over</span> {location}' = 'Le ciel <span class="over">au-dessus</span> de {location}'
    "{pct}% illuminated" = "{pct} % éclairée"
    "moonset {time}" = "coucher de la Lune {time}"
    "The Sky Now · looking up" = "Le ciel maintenant · regard vers le haut"
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Le nord en haut, l'est à gauche — l'orientation d'une carte du ciel, comme allongé sur le dos, les yeux vers le haut.  Cercles de hauteur à 30° et 60° ; le bord est l'horizon."
    "The sun is up, so the plate shows the stars where they stand behind the daylight — Skyfield knows, even when you cannot see them." = "Le soleil est levé : la carte montre les étoiles là où elles se tiennent derrière la lumière du jour — Skyfield le sait, même quand on ne peut pas les voir."
    "Dot size follows magnitude; the brighter the star, the larger the mark." = "La taille des points suit la magnitude : plus l'étoile est brillante, plus la marque est grande."
    "Hover or tap any mark for its coordinates." = "Survolez ou touchez une marque pour lire ses coordonnées."
    "Rise & Set · today" = "Levers & couchers · aujourd'hui"
    "Bars span each body's time above the horizon; the tick across each bar is the transit.  Background bands are tonight's darkness: civil, nautical and astronomical twilight — the USNO geometric definitions." = "Les barres couvrent le temps que chaque astre passe au-dessus de l'horizon ; le trait en travers de chaque barre est le transit.  Les bandes d'arrière-plan sont l'obscurité de cette nuit : crépuscules civil, nautique et astronomique — selon les définitions géométriques de l'USNO."
    "The Solar Year · daylight week by week" = "L'année solaire · la lumière du jour semaine après semaine"
    "Sunrise, sunset and solar noon (dashed) for every week of the year, over the same twilight bands as the timeline above — in local clock time, so the daylight-saving steps in spring and fall are real.  The brass line is today." = "Lever, coucher et midi solaire (en pointillé) pour chaque semaine de l'année, sur les mêmes bandes crépusculaires que la frise ci-dessus — en heure locale : les sauts de l'heure d'été, au printemps et à l'automne, sont donc réels.  La ligne laiton marque aujourd'hui."
    "The Lunar Month · this lunation" = "Le mois lunaire · cette lunaison"
    "New moon to new moon in thirty steps, the principal phases dated; the brass ring is today.  Hover or tap any disc for its date and illumination." = "De nouvelle lune à nouvelle lune en trente pas, les phases principales datées ; l'anneau laiton marque aujourd'hui.  Survolez ou touchez un disque pour lire sa date et son éclairement."
    "The Almanac Table" = "Le tableau de l'almanach"
    "Every value on this page is a WeeWX report tag served by weewx-skyfield — no PyEphem, and the page itself fetches nothing." = "Chaque valeur de cette page est un tag de rapport WeeWX servi par weewx-skyfield — pas de PyEphem, et la page elle-même ne télécharge rien."
    "Sun & Planets · today" = "Soleil & planètes · aujourd'hui"
    "Satellites · the next visible pass" = "Satellites · le prochain passage visible"
    "Each row is the satellite's next visible pass — visible means the satellite is sunlit while your sky is dark, peaking at least 10° up.  The soonest of these passes gets its own chart below.  Orbital elements refresh from CelesTrak every few hours." = "Chaque ligne est le prochain passage visible du satellite — visible signifie que le satellite est éclairé par le Soleil pendant que le ciel local est sombre, et culmine à au moins 10°.  Le plus proche de ces passages a sa propre carte ci-dessous.  Les éléments orbitaux sont actualisés depuis CelesTrak toutes les quelques heures."
    "The Next Visible Pass · the sky at its peak" = "Le prochain passage visible · le ciel au point culminant"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Le ciel entier tel qu'il sera au point culminant du passage, à la date indiquée — l'arc en tirets est la trajectoire du satellite, avec les heures d'apparition et de disparition aux extrémités.  Seules les étoiles assez brillantes pour un ciel crépusculaire sont tracées : un passage visible se produit quand le ciel n'est qu'à demi sombre."
    "The Sun’s Path · today" = "La course du Soleil · aujourd'hui"
    "Altitude against azimuth from midnight to midnight, a dot every hour.  The dashed curve is the moon’s path, its rise, set and highest point marked with times; the 00 and 24 dots are the moon’s positions at the day’s two midnights — the curve is open between them because a lunar day runs about 50 minutes longer than a calendar day, and near full moon that break sits right at the top of the arc.  The bands below the horizon line are civil, nautical and astronomical twilight depth." = "Hauteur contre azimut de minuit à minuit, un point par heure.  La courbe en pointillé est la course de la Lune, avec les heures de son lever, de son coucher et de son point culminant ; les points 00 et 24 sont les positions de la Lune aux deux minuits de la journée — la courbe reste ouverte entre eux, car un jour lunaire dure environ 50 minutes de plus qu'un jour calendaire, et près de la pleine lune cette coupure se place juste au sommet de l'arc.  Les bandes sous la ligne d'horizon sont la profondeur des crépuscules civil, nautique et astronomique."
    "The Solar System · today's positions" = "Le Système solaire · les positions du jour"
    "Heliocentric longitudes, viewed from above the north ecliptic pole; orbit spacing is logarithmic.  The dashed ray marks 0° (the direction of the vernal equinox)." = "Longitudes héliocentriques, vues de dessus le pôle nord de l'écliptique ; l'espacement des orbites est logarithmique.  Le rayon en pointillé marque 0° (la direction du point vernal)."
    "Analemma · the sun at noon" = "Analemme · le soleil à midi"
    "The sun's altitude and azimuth at local standard noon for every week of the year.  The figure-eight is the sum of Earth's tilt and its elliptical orbit; the brass point is today." = "Hauteur et azimut du soleil au midi de l'heure normale, pour chaque semaine de l'année.  Le huit est la somme de l'inclinaison de l'axe terrestre et de l'orbite elliptique de la Terre ; le point laiton marque aujourd'hui."

