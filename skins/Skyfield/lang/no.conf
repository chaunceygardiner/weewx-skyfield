# skins/Skyfield/lang/no.conf
#
# Norwegian (Bokmål) -- Norsk.  Complete; Beta pending native-speaker
# review.  Corrections welcome at
# https://github.com/chaunceygardiner/weewx-skyfield/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Hemisphere abbreviations, for the latitude/longitude in the header
    hemispheres = N, S, Ø, V

[Units]

    [[Ordinates]]

        # Compass ordinal directions; the panels use N, Ø, S and V.
        # As in WeeWX's own no.conf.
        directions = N, NNØ, NØ, ØNØ, Ø, ØSØ, SØ, SSØ, S, SSV, SV, VSV, V, VNV, NV, NNV, N/A

[Almanac]

    # Moon phase names, for $almanac.moon_phase in the header.
    # As in WeeWX's own no.conf.
    moon_phases = Nymåne, Voksende sigd, Første kvarter, Voksende måne, Fullmåne, Avtakende måne, Siste kvarter, Avtakende sigd

    # Body display names, keyed by tag name: $almanac.<body>.label and
    # every panel label, chip, table row and tooltip.  Named stars may be
    # added the same way (e.g. polaris = Polarstjernen).
    sun = Solen
    moon = Månen
    mercury = Merkur
    venus = Venus
    earth = Jorden
    mars = Mars
    jupiter = Jupiter
    saturn = Saturn
    uranus = Uranus
    neptune = Neptun

    # Satellite display names, keyed by tag name -- the [Skyfield]
    # [[Satellites]] entries.
    iss = ISS
    tiangong = Tiangong
    hst = HST

    # Comet display names, keyed by tag name -- the [Skyfield]
    # [[Comets]] entries.  A comet without one shows its tag name
    # title-cased.
    halley = Halley
    hale_bopp = Hale-Bopp

    # Meteor shower display names, keyed by the shower key --
    # $almanac.next_meteor_shower.label and the countdown chip.
    [[MeteorShowers]]
        quadrantids = Kvadrantider
        lyrids = Lyrider
        eta_aquariids = Eta-akvarider
        delta_aquariids = Sørlige delta-akvarider
        perseids = Perseider
        draconids = Drakonider
        orionids = Orionider
        southern_taurids = Sørlige taurider
        northern_taurids = Nordlige taurider
        leonids = Leonider
        geminids = Geminider
        ursids = Ursider

