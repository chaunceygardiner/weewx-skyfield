[Texts]

    # ── paginaproza (index.html.tmpl) ────────────────────────────────────
    "The Sky over {location}" = "De hemel boven {location}"
    'The Sky <span class="over">over</span> {location}' = 'De hemel <span class="over">boven</span> {location}'
    "{pct}% illuminated" = "{pct}% verlicht"
    "moonset {time}" = "maansondergang {time}"
    "The Sky Now · looking up" = "De hemel nu · omhoog kijkend"
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Het noorden boven, het oosten links — de oriëntatie van een sterrenkaart, alsof je op je rug omhoog ligt te kijken.  Hoogtecirkels op 30° en 60°; de rand is de horizon."
    "The sun is up, so the plate shows the stars where they stand behind the daylight — Skyfield knows, even when you cannot see them." = "De zon is op, dus de kaart toont de sterren waar ze achter het daglicht staan — Skyfield weet het, ook wanneer je ze niet kunt zien."
    "Dot size follows magnitude; the brighter the star, the larger the mark." = "De puntgrootte volgt de magnitude: hoe helderder de ster, hoe groter de markering."
    "Hover or tap any mark for its coordinates." = "Beweeg de muis over een markering of tik erop voor de coördinaten."
    "Rise & Set · today" = "Opkomst & ondergang · vandaag"
    "Bars span each body's time above the horizon; the tick across each bar is the transit.  Background bands are tonight's darkness: civil, nautical and astronomical twilight — the USNO geometric definitions." = "De balken beslaan de tijd die elk hemellichaam boven de horizon doorbrengt; het streepje dwars op elke balk is de transit.  De banden op de achtergrond zijn de duisternis van vannacht: burgerlijke, nautische en astronomische schemering — de geometrische definities van de USNO."
    "The Solar Year · daylight week by week" = "Het zonnejaar · daglicht week na week"
    "Sunrise, sunset and solar noon (dashed) for every week of the year, over the same twilight bands as the timeline above — in local clock time, so the daylight-saving steps in spring and fall are real.  The brass line is today." = "Zonsopkomst, zonsondergang en ware middag (gestippeld) voor elke week van het jaar, over dezelfde schemeringsbanden als de tijdlijn hierboven — in lokale kloktijd, dus de zomertijdsprongen in voor- en najaar zijn echt.  De messingkleurige lijn is vandaag."
    "The Lunar Month · this lunation" = "De maanmaand · deze lunatie"
    "New moon to new moon in thirty steps, the principal phases dated; the brass ring is today.  Hover or tap any disc for its date and illumination." = "Van nieuwe maan tot nieuwe maan in dertig stappen, de hoofdfasen gedateerd; de messingkleurige ring is vandaag.  Beweeg de muis over een schijfje of tik erop voor de datum en de verlichting."
    "The Almanac Table" = "De almanaktabel"
    "Every value on this page is a WeeWX report tag served by weewx-skyfield — no PyEphem, and the page itself fetches nothing." = "Elke waarde op deze pagina is een WeeWX-rapporttag geleverd door weewx-skyfield — geen PyEphem, en de pagina zelf haalt niets op."
    "Sun & Planets · today" = "Zon & planeten · vandaag"
    "Satellites · the next visible pass" = "Satellieten · de volgende zichtbare overgang"
    "Each row is the satellite's next visible pass — visible means the satellite is sunlit while your sky is dark, peaking at least 10° up.  The soonest of these passes gets its own chart below.  Orbital elements refresh from CelesTrak every few hours." = "Elke rij is de volgende zichtbare overgang van de satelliet — zichtbaar betekent dat de satelliet door de zon wordt verlicht terwijl de hemel ter plaatse donker is, met een hoogste punt van minstens 10°.  De eerstvolgende van deze overgangen krijgt hieronder een eigen kaart.  De baanelementen worden elke paar uur ververst vanaf CelesTrak."
    "The Next Visible Pass · the sky at its peak" = "De volgende zichtbare overgang · de hemel op het hoogste punt"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "De hele hemel zoals die op het hoogste punt van de overgang zal staan, op de datum hierboven — de streepjesboog is de baan van de satelliet, met de tijden van verschijnen en verdwijnen aan de uiteinden.  Alleen sterren die helder genoeg zijn voor een schemerhemel worden getekend: een zichtbare overgang vindt plaats terwijl de hemel half donker is."
    "The Sun’s Path · today" = "De baan van de zon · vandaag"
    "Altitude against azimuth from midnight to midnight, a dot every hour.  The dashed curve is the moon’s path, its rise, set and highest point marked with times; the 00 and 24 dots are the moon’s positions at the day’s two midnights — the curve is open between them because a lunar day runs about 50 minutes longer than a calendar day, and near full moon that break sits right at the top of the arc.  The bands below the horizon line are civil, nautical and astronomical twilight depth." = "Hoogte tegen azimut van middernacht tot middernacht, een punt per uur.  De gestippelde kromme is de baan van de maan, met de tijden van haar opkomst, ondergang en hoogste punt; de punten 00 en 24 zijn de posities van de maan op de twee middernachten van de dag — de kromme is daartussen open, want een maansdag duurt ongeveer 50 minuten langer dan een kalenderdag, en rond volle maan zit die opening precies boven aan de boog.  De banden onder de horizonlijn zijn de diepte van de burgerlijke, nautische en astronomische schemering."
    "The Solar System · today's positions" = "Het zonnestelsel · de posities van vandaag"
    "Heliocentric longitudes, viewed from above the north ecliptic pole; orbit spacing is logarithmic.  The dashed ray marks 0° (the direction of the vernal equinox)." = "Heliocentrische lengtes, gezien van boven de noordpool van de ecliptica; de afstand tussen de banen is logaritmisch.  De gestippelde straal markeert 0° (de richting van het lentepunt)."
    "Analemma · the sun at noon" = "Analemma · de zon op het middaguur"
    "The sun's altitude and azimuth at local standard noon for every week of the year.  The figure-eight is the sum of Earth's tilt and its elliptical orbit; the brass point is this week." = "De hoogte en het azimut van de zon op het middaguur van de standaardtijd, voor elke week van het jaar.  De acht is de som van de schuine stand van de aardas en de elliptische baan van de aarde; het messingkleurige punt is deze week."

