[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The Sky over {location}" = "Il cielo sopra {location}"
    'The Sky <span class="over">over</span> {location}' = 'Il cielo <span class="over">sopra</span> {location}'
    "{pct}% illuminated" = "{pct}% illuminata"
    "moonset {time}" = "tramonto della Luna {time}"
    "The Sky Now · looking up" = "Il cielo adesso · guardando in alto"
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Il nord in alto, l'est a sinistra — l'orientamento delle carte celesti, come sdraiati sulla schiena a guardare in su.  Cerchi di altezza a 30° e 60°; il bordo è l'orizzonte."
    "The sun is up, so the plate shows the stars where they stand behind the daylight — Skyfield knows, even when you cannot see them." = "Il Sole è sopra l'orizzonte, quindi la carta mostra le stelle là dove si trovano dietro la luce del giorno — Skyfield lo sa, anche quando non puoi vederle."
    "Dot size follows magnitude; the brighter the star, the larger the mark." = "La dimensione dei punti segue la magnitudine: più brillante è la stella, più grande è il segno."
    "Hover or tap any mark for its coordinates." = "Passa il cursore su un segno, o toccalo, per vederne le coordinate."
    "Rise & Set · today" = "Levate & tramonti · oggi"
    "Bars span each body's time above the horizon; the tick across each bar is the transit.  Background bands are tonight's darkness: civil, nautical and astronomical twilight — the USNO geometric definitions." = "Le barre coprono il tempo che ciascun astro passa sopra l'orizzonte; il segno che attraversa ogni barra è il transito.  Le bande sullo sfondo sono l'oscurità di questa notte: crepuscolo civile, nautico e astronomico — le definizioni geometriche dell'USNO."
    "The Solar Year · daylight week by week" = "L'anno solare · la luce del giorno settimana per settimana"
    "Sunrise, sunset and solar noon (dashed) for every week of the year, over the same twilight bands as the timeline above — in local clock time, so the daylight-saving steps in spring and fall are real.  The brass line is today." = "Alba, tramonto e mezzogiorno solare (tratteggiato) per ogni settimana dell'anno, sulle stesse bande crepuscolari della linea temporale qui sopra — in ora locale dell'orologio, così i salti dell'ora legale in primavera e in autunno sono reali.  La linea color ottone è oggi."
    "The Lunar Month · this lunation" = "Il mese lunare · questa lunazione"
    "New moon to new moon in thirty steps, the principal phases dated; the brass ring is today.  Hover or tap any disc for its date and illumination." = "Da luna nuova a luna nuova in trenta passi, con le fasi principali datate; l'anello color ottone è oggi.  Passa il cursore su un disco, o toccalo, per vederne la data e l'illuminazione."
    "The Almanac Table" = "La tabella dell'almanacco"
    "Every value on this page is a WeeWX report tag served by weewx-skyfield — no PyEphem, and the page itself fetches nothing." = "Ogni valore di questa pagina è un tag di report WeeWX servito da weewx-skyfield — niente PyEphem, e la pagina stessa non scarica nulla."
    "Sun & Planets · today" = "Sole & pianeti · oggi"
    "Satellites · the next visible pass" = "Satelliti · il prossimo passaggio visibile"
    "Each row is the satellite's next visible pass — visible means the satellite is sunlit while your sky is dark, peaking at least 10° up.  The soonest of these passes gets its own chart below.  Orbital elements refresh from CelesTrak every few hours." = "Ogni riga è il prossimo passaggio visibile del satellite — visibile significa che il satellite è illuminato dal Sole mentre il cielo locale è buio, culminando ad almeno 10°.  Il più vicino di questi passaggi ha la sua carta qui sotto.  Gli elementi orbitali si aggiornano da CelesTrak ogni poche ore."
    "The Next Visible Pass · the sky at its peak" = "Il prossimo passaggio visibile · il cielo al punto più alto"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Il cielo intero come sarà al punto più alto del passaggio, alla data indicata sopra — l'arco tratteggiato è la traiettoria del satellite, con gli orari della sua comparsa e della sua scomparsa alle estremità.  Sono disegnate solo le stelle abbastanza brillanti per un cielo crepuscolare: un passaggio visibile avviene mentre il cielo è a metà buio."
    "The Sun’s Path · today" = "Il percorso del Sole · oggi"
    "Altitude against azimuth from midnight to midnight, a dot every hour.  The dashed curve is the moon’s path, its rise, set and highest point marked with times; the 00 and 24 dots are the moon’s positions at the day’s two midnights — the curve is open between them because a lunar day runs about 50 minutes longer than a calendar day, and near full moon that break sits right at the top of the arc.  The bands below the horizon line are civil, nautical and astronomical twilight depth." = "Altezza contro azimut da mezzanotte a mezzanotte, un punto ogni ora.  La curva tratteggiata è il percorso della Luna, con gli orari della sua levata, del suo tramonto e del suo punto più alto; i punti 00 e 24 sono le posizioni della Luna alle due mezzanotti del giorno — la curva resta aperta tra loro perché un giorno lunare dura circa 50 minuti più di un giorno del calendario, e vicino alla luna piena quell'apertura cade proprio in cima all'arco.  Le bande sotto la linea dell'orizzonte sono la profondità del crepuscolo civile, nautico e astronomico."
    "The Solar System · today's positions" = "Il sistema solare · le posizioni di oggi"
    "Heliocentric longitudes, viewed from above the north ecliptic pole; orbit spacing is logarithmic.  The dashed ray marks 0° (the direction of the vernal equinox)." = "Longitudini eliocentriche, viste da sopra il polo nord dell'eclittica; la spaziatura delle orbite è logaritmica.  Il raggio tratteggiato segna 0° (la direzione del punto vernale)."
    "Analemma · the sun at noon" = "Analemma · il Sole a mezzogiorno"
    "The sun's altitude and azimuth at local standard noon for every week of the year.  The figure-eight is the sum of Earth's tilt and its elliptical orbit; the brass point is today." = "L'altezza e l'azimut del Sole al mezzogiorno dell'ora standard locale, per ogni settimana dell'anno.  L'otto è la somma dell'inclinazione dell'asse terrestre e dell'orbita ellittica della Terra; il punto color ottone è oggi."

