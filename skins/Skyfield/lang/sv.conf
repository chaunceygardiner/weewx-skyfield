[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The Sky over {location}" = "Himlen över {location}"
    'The Sky <span class="over">over</span> {location}' = 'Himlen <span class="over">över</span> {location}'
    "{pct}% illuminated" = "{pct}% belyst"
    "moonset {time}" = "månnedgång {time}"
    "The Sky Now · looking up" = "Himlen nu · med blicken uppåt"
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Norr överst, öster till vänster — stjärnkartans orientering, som om du låg på rygg och tittade upp.  Höjdringar vid 30° och 60°; kanten är horisonten."
    "The sun is up, so the plate shows the stars where they stand behind the daylight — Skyfield knows, even when you cannot see them." = "Solen är uppe, så kartan visar stjärnorna där de står bakom dagsljuset — Skyfield vet det, även när du inte kan se dem."
    "Dot size follows magnitude; the brighter the star, the larger the mark." = "Prickarnas storlek följer magnituden; ju ljusstarkare stjärna, desto större markering."
    "Hover or tap any mark for its coordinates." = "Håll pekaren över eller tryck på en markering för att se dess koordinater."
    "Rise & Set · today" = "Upp- och nedgång · i dag"
    "Bars span each body's time above the horizon; the tick across each bar is the transit.  Background bands are tonight's darkness: civil, nautical and astronomical twilight — the USNO geometric definitions." = "Staplarna spänner över den tid varje himlakropp står över horisonten; strecket tvärs över varje stapel är kulminationen.  Banden i bakgrunden är nattens mörker: borgerlig, nautisk och astronomisk skymning — USNO:s geometriska definitioner."
    "The Solar Year · daylight week by week" = "Solåret · dagsljus vecka för vecka"
    "Sunrise, sunset and solar noon (dashed) for every week of the year, over the same twilight bands as the timeline above — in local clock time, so the daylight-saving steps in spring and fall are real.  The brass line is today." = "Soluppgång, solnedgång och sann middag (streckad) för varje vecka på året, över samma skymningsband som tidslinjen ovanför — i lokal klocktid, så sommartidsskiftena vår och höst är verkliga.  Den mässingsfärgade linjen är i dag."
    "The Lunar Month · this lunation" = "Månmånaden · denna lunation"
    "New moon to new moon in thirty steps, the principal phases dated; the brass ring is today.  Hover or tap any disc for its date and illumination." = "Från nymåne till nymåne i trettio steg, med huvudfaserna daterade; den mässingsfärgade ringen är i dag.  Håll pekaren över eller tryck på en skiva för att se dess datum och belysning."
    "The Almanac Table" = "Almanackstabellen"
    "Every value on this page is a WeeWX report tag served by weewx-skyfield — no PyEphem, and the page itself fetches nothing." = "Varje värde på den här sidan är en WeeWX-rapporttag levererad av weewx-skyfield — ingen PyEphem, och sidan själv hämtar ingenting."
    "Sun & Planets · today" = "Solen och planeterna · i dag"
    "Satellites · the next visible pass" = "Satelliter · nästa synliga passage"
    "Each row is the satellite's next visible pass — visible means the satellite is sunlit while your sky is dark, peaking at least 10° up.  The soonest of these passes gets its own chart below.  Orbital elements refresh from CelesTrak every few hours." = "Varje rad är satellitens nästa synliga passage — synlig betyder att satelliten är solbelyst medan din himmel är mörk, och når minst 10° upp.  Den närmaste av dessa passager får ett eget kort nedanför.  Banelementen uppdateras från CelesTrak med några timmars mellanrum."
    "The Next Visible Pass · the sky at its peak" = "Nästa synliga passage · himlen vid högsta punkten"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Hela himlen som den kommer att stå vid passagens högsta punkt, på datumet ovanför — den streckade bågen är satellitens bana, med tiderna då den dyker upp och försvinner i ändarna.  Bara stjärnor som är ljusa nog för en skymningshimmel ritas: en synlig passage sker medan himlen är halvmörk."
    "The Sun’s Path · today" = "Solens bana · i dag"
    "Altitude against azimuth from midnight to midnight, a dot every hour.  The dashed curve is the moon’s path, its rise, set and highest point marked with times; the 00 and 24 dots are the moon’s positions at the day’s two midnights — the curve is open between them because a lunar day runs about 50 minutes longer than a calendar day, and near full moon that break sits right at the top of the arc.  The bands below the horizon line are civil, nautical and astronomical twilight depth." = "Höjd mot azimut från midnatt till midnatt, en prick varje timme.  Den streckade kurvan är Månens bana, med tider för uppgång, nedgång och högsta punkt; prickarna 00 och 24 är Månens positioner vid dygnets två midnätter — kurvan är öppen mellan dem eftersom ett måndygn är ungefär 50 minuter längre än ett kalenderdygn, och nära fullmåne ligger avbrottet högst upp på bågen.  Banden under horisontlinjen är djupet av borgerlig, nautisk och astronomisk skymning."
    "The Solar System · today's positions" = "Solsystemet · dagens positioner"
    "Heliocentric longitudes, viewed from above the north ecliptic pole; orbit spacing is logarithmic.  The dashed ray marks 0° (the direction of the vernal equinox)." = "Heliocentriska longituder, sedda ovanifrån ekliptikans nordpol; avståndet mellan banorna är logaritmiskt.  Den streckade strålen markerar 0° (riktningen mot vårdagjämningspunkten)."
    "Analemma · the sun at noon" = "Analemma · Solen vid middag"
    "The sun's altitude and azimuth at local standard noon for every week of the year.  The figure-eight is the sum of Earth's tilt and its elliptical orbit; the brass point is today." = "Solens höjd och azimut vid normaltidens middag för varje vecka på året.  Åttan är summan av jordaxelns lutning och Jordens elliptiska bana; den mässingsfärgade punkten är i dag."

